<section class="form-page"><h1>{{ id ? 'Edit project' : 'New project' }}</h1>@if(error()){<p class="error" role="alert">{{error()}}</p>}<form [formGroup]="form" (ngSubmit)="save()" novalidate><label for="name">Name</label><input id="name" formControlName="name" maxlength="150">@if(form.controls.name.touched && form.controls.name.invalid){<small>Enter a project name up to 150 characters.</small>}<label for="description">Description</label><textarea id="description" formControlName="description" rows="4"></textarea><div class="actions"><a routerLink="/projects">Cancel</a><button [disabled]="saving()">{{saving()?'Saving…':'Save project'}}</button></div></form></section>
