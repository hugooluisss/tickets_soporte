<section class="mx-auto my-8 max-w-2xl px-4">
  <h1 class="mb-4 text-2xl font-bold">{{ (id ? 'user.edit' : 'user.new') | translate }}</h1>
  @if (error()) {
    <p class="mb-4 rounded-md bg-danger-bg p-3 text-danger" role="alert">{{ error() }}</p>
  }
  <form
    class="grid gap-4 rounded-lg border border-slate-200 bg-white p-6"
    [formGroup]="form"
    (ngSubmit)="save()"
    novalidate
  >
    <app-form-field
      id="user-email"
      [label]="'user.email' | translate"
      type="email"
      [control]="form.controls.email"
      [errorMessage]="'user.emailError' | translate"
    />
    <app-form-field
      id="user-first-name"
      [label]="'user.firstName' | translate"
      [control]="form.controls.firstName"
      [errorMessage]="'user.requiredError' | translate"
    />
    <app-form-field
      id="user-last-name"
      [label]="'user.lastName' | translate"
      [control]="form.controls.lastName"
      [errorMessage]="'user.requiredError' | translate"
    />
    <app-form-field
      id="user-role"
      [label]="'user.role' | translate"
      kind="select"
      [control]="form.controls.role"
    >
      <option value="admin">{{ 'user.roleAdmin' | translate }}</option>
      <option value="user">{{ 'user.roleUser' | translate }}</option>
    </app-form-field>
    <app-form-field
      id="user-status"
      [label]="'user.status' | translate"
      kind="select"
      [control]="form.controls.isActive"
    >
      <option value="true">{{ 'user.active' | translate }}</option>
      <option value="false">{{ 'user.inactive' | translate }}</option>
    </app-form-field>
    <app-form-field
      id="user-password"
      [label]="'user.password' | translate"
      type="password"
      [control]="form.controls.password"
      [errorMessage]="'user.passwordError' | translate"
    />
    <p class="-mt-3 text-sm text-slate-500">
      {{ id ? ('user.passwordOptional' | translate) : ('user.passwordHint' | translate) }}
    </p>
    <div class="mt-2 flex justify-between">
      <a class="text-brand underline" routerLink="/admin">{{ 'common.cancel' | translate }}</a
      ><button
        class="rounded-md bg-brand px-4 py-2 font-semibold text-white disabled:opacity-65"
        [disabled]="saving()"
      >
        {{ saving() ? ('common.saving' | translate) : ('user.save' | translate) }}
      </button>
    </div>
  </form>
</section>
