<section class="form-page"><h1>{{id?'Edit ticket':'New ticket'}}</h1>@if(error()){<p class="error" role="alert">{{error()}}</p>}<form [formGroup]="form" (ngSubmit)="save()" novalidate><label>Title<input formControlName="title" maxlength="255"></label>@if(form.controls.title.touched&&form.controls.title.invalid){<small>A title is required (255 characters maximum).</small>}<label>Description<textarea formControlName="description" rows="5"></textarea></label><div class="grid"><label>Kind<select formControlName="kind">@for(x of kinds;track x){<option [value]="x">{{x}}</option>}</select></label><label>Priority<select formControlName="priority">@for(x of priorities;track x){<option [value]="x">{{x}}</option>}</select></label><label>Status<select formControlName="status">@for(x of statuses;track x){<option [value]="x">{{x}}</option>}</select></label><label>Project<select formControlName="projectId"><option value="">No project</option>@for(p of projects();track p.id){<option [value]="p.id">{{p.name}}</option>}</select></label><label>Category<select formControlName="categoryId"><option value="">No category</option>@for(c of categories();track c.id){<option [value]="c.id">{{c.name}}</option>}</select></label><label>Assignee<select formControlName="assignedToId"><option value="">Unassigned</option>@for(u of users();track u.id){<option [value]="u.id">{{u.firstName}} {{u.lastName}} ({{u.email}})</option>}</select></label></div><div class="actions"><a routerLink="/tickets">Cancel</a><button [disabled]="saving()">{{saving()?'Saving…':'Save ticket'}}</button></div></form></section>
