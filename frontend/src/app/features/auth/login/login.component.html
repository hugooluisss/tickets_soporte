<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Sign in</h1>
    <p>Access your support workspace.</p>
    @if (errorMessage()) { <div class="error" role="alert">{{ errorMessage() }}</div> }
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" formControlName="email">
      @if (form.controls.email.touched && form.controls.email.invalid) { <small>Enter a valid email address.</small> }
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" formControlName="password">
      @if (form.controls.password.touched && form.controls.password.hasError('required')) { <small>Password is required.</small> }
      <button type="submit" [disabled]="submitting()">{{ submitting() ? 'Signing in…' : 'Sign in' }}</button>
    </form>
  </section>
</main>
