<section class="page"><header><div><h1>Categories</h1><p>Classify support tickets.</p></div><a class="button" routerLink="/categories/new">New category</a></header>@if(error()){<p class="error" role="alert">{{error()}}</p>}<table><thead><tr><th>Name</th><th>Actions</th></tr></thead><tbody>@for(row of rows();track row.id){<tr><td>{{row.name}}</td><td><a [routerLink]="['/categories',row.id,'edit']">Edit</a> <button (click)="remove(row)">Delete</button></td></tr>}@empty{<tr><td colspan="2">No categories yet.</td></tr>}</tbody></table></section>
