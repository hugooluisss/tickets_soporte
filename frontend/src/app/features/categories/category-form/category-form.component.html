<section class="form-page"><h1>{{id?'Edit category':'New category'}}</h1>@if(error()){<p class="error" role="alert">{{error()}}</p>}<form [formGroup]="form" (ngSubmit)="save()" novalidate><label for="name">Name</label><input id="name" formControlName="name" maxlength="150">@if(form.controls.name.touched&&form.controls.name.invalid){<small>A category name is required (150 characters maximum).</small>}<div class="actions"><a routerLink="/categories">Cancel</a><button [disabled]="saving()">Save category</button></div></form></section>
